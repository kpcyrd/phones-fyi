[package]
name = "phones-fyi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
astral-tokio-tar = "0.5.6"
async-compression = { version = "0.4.36", features = ["gzip", "tokio"] }
bytes = "1.11.0"
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"
glob = "0.3.3"
handlebars = "6.3.2"
kuchikiki = "0.8.2"
log = "0.4.29"
reqwest = { version = "0.13.1", features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread"] }
tokio-stream = "0.1.17"
tokio-util = "0.7.17"
toml = { version = "0.9.10", features = ["serde"] }
