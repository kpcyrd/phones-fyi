[package]
name = "phones-fyi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
env_logger = "0.11.8"
handlebars = "6.3.2"
kuchikiki = "0.8.2"
log = "0.4.29"
reqwest = "0.13.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "1.48.0", features = ["fs", "macros", "rt-multi-thread"] }
toml = { version = "0.9.10", features = ["serde"] }
